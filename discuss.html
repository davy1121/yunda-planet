<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云大学习讨论 · 云大星球</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="discuss.css">
  <link rel="stylesheet" href="pageflow.css">
  <script src="pageflow-start.js"></script>
  <script src="pageflow.js" defer></script>
  <script src="discuss.js" defer></script>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <span class="orb orb-pink"></span>
    <span class="orb orb-peach"></span>
    <span class="orb orb-yellow"></span>
    <span class="orb orb-mint"></span>
    <span class="orb orb-sky"></span>
    <span class="orb orb-lavender"></span>
  </div>

  <main class="discuss-page">
    <header class="discuss-header">
      <a class="back-link" href="index.html">← 返回星球主页</a>
      <div class="discuss-heading">
        <h1>💬 云大学习讨论</h1>
        <p>和云大的同学一起讨论课程、四六级、各类比赛和备考经验。</p>
      </div>
    </header>

    <section class="discuss-toolbar" aria-label="发帖与统计">
      <button class="tool-btn compose-btn" id="composeBtn" type="button">＋ 发布新帖</button>
      <p class="post-stat" id="postStat">还没有帖子</p>
    </section>
    <p class="storage-note">
      ℹ️ 当前帖子保存在这台电脑的浏览器里。以后接上服务器后，就能让所有同学一起看到、一起讨论。
    </p>

    <nav class="category-bar" id="categoryBar" aria-label="帖子分类">
      <button class="cat-btn is-active" type="button" data-filter="all">全部</button>
      <button class="cat-btn" type="button" data-filter="course">🎓 课程讨论</button>
      <button class="cat-btn" type="button" data-filter="cet">📘 四六级</button>
      <button class="cat-btn" type="button" data-filter="contest">🏆 比赛竞技</button>
      <button class="cat-btn" type="button" data-filter="other">💬 学习闲聊</button>
    </nav>

    <section class="post-list" id="postList" aria-live="polite"></section>
  </main>

  <!-- 发布新帖 -->
  <div class="d-modal-backdrop" id="composeModal" aria-hidden="true">
    <div class="d-modal-card compose-card" role="dialog" aria-modal="true" aria-labelledby="composeTitle">
      <div class="d-modal-head">
        <h2 id="composeTitle">发布新帖</h2>
        <button class="d-close" type="button" data-close="composeModal" aria-label="关闭">×</button>
      </div>

      <form id="composeForm">
        <div class="form-grid">
          <label class="d-field">
            <span>讨论板块</span>
            <select id="postCategory">
              <option value="course">课程讨论</option>
              <option value="cet">四六级</option>
              <option value="contest">比赛竞技</option>
              <option value="other">学习闲聊</option>
            </select>
          </label>
          <label class="d-field">
            <span>昵称（可选）</span>
            <input id="postAuthor" type="text" maxlength="16" placeholder="默认：云大学子">
          </label>
        </div>

        <label class="d-field">
          <span>标题 <em>*</em></span>
          <input id="postTitle" type="text" maxlength="60" placeholder="例如：求推荐高数复习资料">
        </label>

        <label class="d-field">
          <span>内容 <em>*</em></span>
          <textarea id="postContent" rows="7" maxlength="3000"
                    placeholder="写下你想讨论的问题或经验，比如课程难点、四六级备考方法、比赛组队信息等。"></textarea>
        </label>

        <div class="d-modal-actions">
          <button class="d-btn ghost" type="button" data-close="composeModal">取消</button>
          <button class="d-btn solid" type="submit">发布帖子</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 帖子详情与回复 -->
  <div class="d-modal-backdrop" id="threadModal" aria-hidden="true">
    <div class="d-modal-card thread-card" role="dialog" aria-modal="true" aria-labelledby="threadTitle">
      <div class="d-modal-head">
        <h2 id="threadTitle">帖子详情</h2>
        <button class="d-close" type="button" data-close="threadModal" aria-label="关闭">×</button>
      </div>
      <div class="thread-body" id="threadBody"></div>
    </div>
  </div>

  <div class="toast" id="discussToast" role="status" aria-live="polite"></div>
</body>
</html>
